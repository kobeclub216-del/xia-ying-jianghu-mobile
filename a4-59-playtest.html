<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>俠影江湖｜A4-59-M4 角色立繪測試</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}#wrap{position:fixed;inset:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;align-items:center;justify-content:center}canvas{display:block;background:#9ab878;touch-action:none}#rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}#creator{position:fixed;inset:0;z-index:8;background:#111d;display:flex;align-items:center;justify-content:center;color:#fff}#card{width:min(560px,86vw);background:#1e2935;border:2px solid #ffffffaa;border-radius:14px;padding:22px;box-sizing:border-box;text-align:center}#card h1{font-size:28px;margin:0 0 18px}#nameInput{width:82%;font-size:20px;padding:10px;border-radius:8px;border:0;text-align:center}.classes{display:flex;gap:10px;justify-content:center;margin:18px 0}.classBtn{font-size:18px;padding:12px 20px;border-radius:9px;border:2px solid #ffffff55;background:#2b3540;color:#fff}.classBtn.sel{border-color:#fff4b0;background:#355f82}#startBtn{font-size:20px;font-weight:bold;padding:12px 38px;border:0;border-radius:9px;background:#c8a45b;color:#171b20}#hint{font-size:14px;color:#ccc;margin:12px 0 0}@media(orientation:portrait){#rotate{display:flex}}</style><link rel="stylesheet" href="home.css"></head><body>
<main id="home" aria-labelledby="homeTitle">
 <div class="home-scene"><h1 id="homeTitle" class="home-sr">俠影江湖</h1>
 <nav class="home-menu" aria-label="主選單">
  <button id="homeContinue" disabled><span aria-hidden="true">▶</span>繼續江湖</button>
  <button id="homeNew"><span aria-hidden="true">▤</span>初入江湖</button>
  <button id="homeSettings"><span aria-hidden="true">⚙</span>遊戲設定</button>
  <button id="homeExit"><span aria-hidden="true">⇥</span>離開遊戲</button>
 </nav><span class="home-version">A4-59-M7-A · 女性劍俠動畫測試</span></div>
</main>
<dialog id="homeDialog" aria-labelledby="dialogTitle"><h2 id="dialogTitle"></h2><p id="dialogMessage" hidden></p>
<div id="audioSettings" hidden><label>音量 <input id="homeVolume" type="range" min="0" max="100" step="5"><output id="volumeLabel" for="homeVolume"></output></label><label><input id="homeSound" type="checkbox">首頁操作音效</label><button id="previewSound" type="button">試聽音效</button></div>
<form method="dialog"><button id="dialogCancel" value="cancel" autofocus>關閉</button><button id="dialogConfirm" value="confirm" hidden>確認</button></form></dialog>
<p id="saveWarning" role="status" hidden></p>
<div id="wrap" hidden><canvas id="game"></canvas></div><div id="creator" hidden><div id="card"><h1>建立你的江湖角色</h1><input id="nameInput" maxlength="8" placeholder="輸入角色名稱"><div class="classes"><button class="classBtn sel" data-job="劍俠">劍俠</button><button class="classBtn" data-job="遊俠">遊俠</button><button class="classBtn" data-job="武者">武者</button></div><button id="startBtn">踏入江湖</button> <button id="cancelCreator" type="button">返回首頁</button><div id="hint">劍俠：劍　｜　遊俠：弓　｜　武者：長槍</div><div style="margin:12px"><label>角色性別：<select id="a459Sex"><option value="男">男性</option><option value="女">女性</option></select></label></div></div></div><div id="rotate">請將 iPhone 轉成橫向遊玩</div><script>
/* A4-59-G2: paint the existing homepage before fetching or parsing game logic. */
(function(){
 let pending=null,loading=false,ready=false;
 const ids=['homeContinue','homeNew','homeSettings','homeExit'];
 const buttons=ids.map(id=>document.getElementById(id));
 const warning=document.getElementById('saveWarning');
 function report(message){warning.hidden=false;warning.textContent=message}
 function loadScript(src){return new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(new Error('無法載入 '+src));document.body.appendChild(script)})}
 async function initialize(){
   if(ready||loading)return;
   loading=true;
   try{
     for(const path of ['a4-59-game-runtime.js','character-slots.js','character-progress.js','character-game-bridge.js','a4-59-home.js'])await loadScript(path);
     ready=true;warning.hidden=true;
     const target=pending;pending=null;
     if(target)document.getElementById(target).click();
   }catch(e){report('遊戲載入失敗：'+e.message+'。請檢查網路並重試。')}
   finally{loading=false}
 }
 buttons.forEach(button=>button.addEventListener('click',function(event){
   if(ready)return;
   event.preventDefault();event.stopImmediatePropagation();
   pending=button.id;
   report('正在載入遊戲功能，請稍候…');
   initialize();
 },true));
 /* Keep the Continue option accessible before the character store initializes. */
 document.getElementById('homeContinue').disabled=false;
})();
</script></body></html>

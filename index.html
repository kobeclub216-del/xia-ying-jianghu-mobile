<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>俠影江湖：群俠亂鬥 v0.03.1</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{display:block;touch-action:none}#rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}@media(orientation:portrait){#rotate{display:flex}}</style></head><body><div id="wrap"><canvas id="game"></canvas></div><div id="rotate">請將 iPhone 轉成橫向遊玩</div><script>
const c=document.getElementById('game'),x=c.getContext('2d'),W=1280,H=720;c.width=W;c.height=H;function fit(){let s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}addEventListener('resize',fit);fit();const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),D=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let state='play',score=0,skillCD=0,inv=0,combo=0,comboT=0,shake=0,boss=false,loot=[],fx=[],resultT=0;const p={x:300,y:390,hp:100,max:100,face:1,speed:265,atk:0,dodge:0};function E(px,py,b=false){return{x:px,y:py,hp:b?180:45,max:b?180:45,cd:.4,down:0,hit:0,boss:b,warn:0,charge:0}}let es=[];function reset(){state='play';score=0;skillCD=inv=combo=comboT=shake=0;boss=false;loot=[];fx=[];p.x=300;p.y=390;p.hp=100;p.face=1;p.atk=p.dodge=0;es=[E(760,310),E(900,430),E(1040,350)]}
let joy={id:null,cx:170,cy:560,x:170,y:560,dx:0,dy:0},btn=[{n:'攻擊',x:1100,y:570,r:66,t:'a'},{n:'閃避',x:950,y:610,r:48,t:'d'},{n:'育德\n劍法',x:1030,y:450,r:54,t:'s'}];function pos(t){let r=c.getBoundingClientRect();return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}function hit(q,b){return D(q,b)<b.r+12}function joyUp(){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy),m=85;if(d>m){dx*=m/d;dy*=m/d;joy.x=joy.cx+dx;joy.y=joy.cy+dy}joy.dx=dx/m;joy.dy=dy/m}
c.addEventListener('touchstart',e=>{e.preventDefault();for(let t of e.changedTouches){let q=pos(t);if(state!=='play'){if(q.x>480&&q.x<800&&q.y>500&&q.y<620)reset();continue}if(q.x<430&&q.y>360&&joy.id===null){joy.id=t.identifier;joy.x=q.x;joy.y=q.y;joyUp()}else for(let b of btn)if(hit(q,b)){if(b.t==='a')attack();if(b.t==='d')dodge();if(b.t==='s')skill()}}},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===joy.id){let q=pos(t);joy.x=q.x;joy.y=q.y;joyUp()}},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();for(let t of e.changedTouches)if(t.identifier===joy.id){joy.id=null;joy.x=joy.cx;joy.y=joy.cy;joy.dx=joy.dy=0}},{passive:false});
function rumble(ms=18){shake=Math.max(shake,7);if(navigator.vibrate)navigator.vibrate(ms)}function hurt(e,d,kb,down){e.hp-=d;e.hit=.12;e.down=Math.max(e.down,down);e.x+=kb;fx.push({k:'hit',x:e.x,y:e.y,t:.22,m:.22});rumble();if(e.hp<=0){score+=e.boss?100:10;fx.push({k:'death',x:e.x,y:e.y,t:.6,m:.6});if(e.boss){loot.push({x:e.x,y:e.y,n:'青鋼長劍'});state='win';resultT=.5}else if(Math.random()<.55)loot.push({x:e.x,y:e.y,n:'粗製鐵劍'})}}
function attack(){if(p.atk||p.dodge||state!=='play')return;combo=comboT?Math.min(3,combo+1):1;comboT=.58;p.atk=.22;fx.push({k:'slash',x:p.x+55*p.face,y:p.y,t:combo===3?.32:.2,m:combo===3?.32:.2,b:combo===3});let range=combo===3?125:98;es.forEach(e=>{if(e.hp>0&&Math.abs(e.y-p.y)<72&&(e.x-p.x)*p.face>-15&&Math.abs(e.x-p.x)<range)hurt(e,combo===3?18:12,p.face*(combo===3?85:32),combo===3?.55:.12)})}function skill(){if(skillCD||p.dodge||state!=='play')return;skillCD=2.8;p.atk=.45;fx.push({k:'skill',x:p.x,y:p.y,t:.5,m:.5});shake=10;es.forEach(e=>{if(e.hp>0&&D(p,e)<210)hurt(e,30,(e.x>=p.x?1:-1)*120,.75)})}function dodge(){if(!p.dodge&&state==='play'){p.dodge=.32;inv=.4;p.x=clamp(p.x+p.face*90,70,1210)}}function spawnBoss(){boss=true;es.push(E(1060,365,true));fx.push({k:'text',t:1.2,m:1.2});shake=12}
function update(dt){if(state!=='play')return;p.atk=Math.max(0,p.atk-dt);p.dodge=Math.max(0,p.dodge-dt);inv=Math.max(0,inv-dt);skillCD=Math.max(0,skillCD-dt);comboT=Math.max(0,comboT-dt);shake=Math.max(0,shake-30*dt);if(!comboT)combo=0;fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);let dx=joy.dx,dy=joy.dy,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}if(Math.abs(dx)>.08)p.face=Math.sign(dx);if(!p.atk){p.x=clamp(p.x+dx*p.speed*dt,70,1210);p.y=clamp(p.y+dy*p.speed*.72*dt,185,555)}
es.forEach(e=>{if(e.hp<=0)return;e.cd=Math.max(0,e.cd-dt);e.down=Math.max(0,e.down-dt);e.hit=Math.max(0,e.hit-dt);if(e.down||e.hit)return;let d=D(p,e);if(e.boss&&e.warn>0){e.warn-=dt;if(e.warn<=0){e.charge=.28;fx.push({k:'boss',x:e.x,y:e.y,t:.35,m:.35});if(d<145&&inv<=0){p.hp-=24;inv=.55;p.x+=(p.x>=e.x?1:-1)*85;rumble(35)}e.cd=1.5}return}if(e.charge>0){e.charge-=dt;return}if(d>(e.boss?95:70)){let sp=e.boss?85:105;e.x+=(p.x-e.x)/d*sp*dt;e.y+=(p.y-e.y)/d*(e.boss?68:82)*dt}else if(e.cd<=0){if(e.boss){e.warn=.65;return}e.cd=1.15;if(inv<=0){p.hp-=9;inv=.45;p.x+=(p.x>=e.x?1:-1)*28;rumble()}}});if(!boss&&es.slice(0,3).every(e=>e.hp<=0))spawnBoss();loot=loot.filter(l=>{if(D(p,l)<55){score+=l.n==='青鋼長劍'?75:25;return false}return true});if(p.hp<=0){p.hp=0;state='lose';resultT=.5}}
function bar(px,py,w,h,v,m,col){x.fillStyle='#222';x.fillRect(px,py,w,h);x.fillStyle=col;x.fillRect(px+2,py+2,(w-4)*clamp(v/m,0,1),h-4)}function circle(px,py,r,f){x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=f;x.fill();x.strokeStyle='#ffffff55';x.lineWidth=3;x.stroke()}
function draw(){x.clearRect(0,0,W,H);x.save();if(shake)x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87a9bd');g.addColorStop(.42,'#b8c994');g.addColorStop(1,'#718d55');x.fillStyle=g;x.fillRect(-20,-20,W+40,H+40);x.fillStyle='#526e45';x.beginPath();x.moveTo(0,270);x.lineTo(170,150);x.lineTo(330,250);x.lineTo(520,130);x.lineTo(760,260);x.lineTo(940,140);x.lineTo(1280,260);x.lineTo(1280,400);x.lineTo(0,400);x.fill();x.fillStyle='#9e8a61';x.fillRect(0,540,1280,35);x.fillStyle='#0008';x.fillRect(20,20,360,90);x.fillStyle='white';x.font='bold 28px sans-serif';x.textAlign='left';x.fillText('李行天  Lv.1',38,54);bar(38,68,300,22,p.hp,p.max,'#d94d45');x.font='22px sans-serif';x.fillText('戰利值 '+score,400,52);x.fillText(boss?'山賊頭目戰':'敵人 '+es.filter(e=>e.hp>0).length+'/3',400,82);
x.globalAlpha=.25;x.fillStyle='#000';x.beginPath();x.ellipse(p.x,p.y+33,36,13,0,0,7);x.fill();x.globalAlpha=p.dodge?.55:1;x.fillStyle='#e6d6b7';x.beginPath();x.arc(p.x,p.y-20,18,0,7);x.fill();x.fillStyle='#355f82';x.fillRect(p.x-20,p.y-3,40,48);x.strokeStyle='#eee';x.lineWidth=7;x.beginPath();x.moveTo(p.x+10*p.face,p.y+10);x.lineTo(p.x+48*p.face,p.y-5);x.stroke();x.globalAlpha=1;x.fillStyle='white';x.font='18px sans-serif';x.textAlign='center';x.fillText('李行天',p.x,p.y-48);
es.forEach(e=>{if(e.hp<=0)return;if(e.warn>0){x.fillStyle='#ff3b3033';x.beginPath();x.arc(e.x,e.y,150,0,7);x.fill();x.strokeStyle='#ff5544';x.lineWidth=5;x.stroke()}x.globalAlpha=e.down?.55:1;x.fillStyle=e.hit?'#fff':e.boss?'#351c1c':'#532f2f';x.fillRect(e.x-(e.boss?28:20),e.y-5,e.boss?56:40,e.boss?62:48);x.fillStyle=e.hit?'#fff':'#c9a889';x.beginPath();x.arc(e.x,e.y-(e.boss?28:22),e.boss?22:17,0,7);x.fill();x.globalAlpha=1;bar(e.x-(e.boss?55:34),e.y-(e.boss?72:57),e.boss?110:68,e.boss?12:9,e.hp,e.max,e.boss?'#b51f2e':'#d94d45');if(e.boss){x.fillStyle='white';x.font='bold 18px sans-serif';x.fillText(e.warn?'危險！':'山賊頭目',e.x,e.y-82)}});loot.forEach(l=>{x.fillStyle=l.n==='青鋼長劍'?'#6de0ff':'#ffd95a';x.font='bold 22px sans-serif';x.fillText('✦ '+l.n,l.x,l.y-20)});
fx.forEach(f=>{let a=f.t/f.m;x.save();x.globalAlpha=a;if(f.k==='skill'){x.strokeStyle='#8deaff';x.lineWidth=10;x.beginPath();x.arc(f.x,f.y,220*(1-a)+40,-.8,2.5);x.stroke()}else if(f.k==='slash'){x.strokeStyle=f.b?'#fff4b0':'#fff';x.lineWidth=f.b?12:7;x.beginPath();x.arc(f.x,f.y,f.b?70:45,-1.1,1.1);x.stroke()}else if(f.k==='boss'){x.strokeStyle='#ff4a3d';x.lineWidth=14;x.beginPath();x.arc(f.x,f.y,135,-.5,2.5);x.stroke()}else if(f.k==='text'){x.fillStyle='#ffddd8';x.font='bold 46px sans-serif';x.fillText('強敵來襲！',W/2,170)}x.restore()});if(combo>1&&comboT){x.fillStyle='#fff4b0';x.font='bold 34px sans-serif';x.fillText(combo+' HIT',p.x,p.y-92)}circle(joy.cx,joy.cy,90,'#17202a66');circle(joy.x,joy.y,38,'#ffffff99');btn.forEach(b=>{circle(b.x,b.y,b.r,b.t==='s'&&skillCD?'#444a':'#24384dcc');x.fillStyle='white';x.font=(b.t==='a'?'bold 24px':'20px')+' sans-serif';b.n.split('\n').forEach((s,i,a)=>x.fillText(s,b.x,b.y+(i-(a.length-1)/2)*22+7))});if(skillCD){x.font='18px sans-serif';x.fillText(skillCD.toFixed(1),1030,515)}x.restore();if(state!=='play'){x.fillStyle='#000c';x.fillRect(0,0,W,H);x.textAlign='center';x.fillStyle=state==='win'?'#fff4b0':'#fff';x.font='bold 58px sans-serif';x.fillText(state==='win'?'戰鬥勝利！':'李行天倒下了',W/2,270);x.font='28px sans-serif';x.fillStyle='white';x.fillText(state==='win'?'擊敗山賊頭目・獲得青鋼長劍':'閃避敵人攻擊，再找機會反擊',W/2,330);x.fillStyle='#29465f';x.fillRect(480,500,320,100);x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(480,500,320,100);x.fillStyle='white';x.font='bold 32px sans-serif';x.fillText('重新挑戰',640,563)}}}
reset();let last=performance.now();function loop(n){let dt=Math.min(.033,(n-last)/1000);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>俠影江湖 A4-59｜角色介面預覽</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"PingFang TC","Noto Serif TC",serif;color:#291e16}body{background:linear-gradient(180deg,#7ac7f4 0%,#d5ecf6 38%,#a1c5a5 72%,#899b82 100%);background-attachment:fixed}.scene{min-height:100dvh;padding:18px max(16px,env(safe-area-inset-right)) 22px;position:relative;isolation:isolate}.scene:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(145deg,transparent 49%,#7d9e96 49.3%,transparent 68%) 100% 20%/70% 50% no-repeat,linear-gradient(25deg,transparent 52%,#91aca5 52.3%,transparent 70%) 0 35%/70% 50% no-repeat;opacity:.55}header{text-align:center;margin:0 auto 14px;max-width:520px;background:#1e2025;color:#f7d897;border:3px double #d8a950;box-shadow:0 3px 0 #51331d,0 7px 18px #0004;padding:9px;font-size:clamp(18px,3vw,29px);font-weight:800;letter-spacing:.12em}.layout{max-width:1080px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:5px ridge #c6933b;border-radius:12px;background:linear-gradient(145deg,#f6e8c8,#ddc6a4);box-shadow:0 7px 20px #243f4b60;padding:16px;min-height:290px}.panel h2{margin:0 0 14px;text-align:center;background:#262328;color:#f1d28c;border:2px solid #c59a4f;border-radius:5px;padding:7px;font-size:19px}.slots{max-width:1100px;margin:18px auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.slot{min-height:255px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;cursor:pointer}.slot[aria-pressed=true]{outline:3px solid #ffe6a1;outline-offset:3px}.sprite{height:90px;display:grid;place-items:center;font-size:54px;filter:drop-shadow(2px 4px 1px #0003)}.muted{color:#725c48}.plate{background:#252329;color:#f3d39a;border:2px solid #c79b4b;border-radius:6px;padding:7px 16px;text-align:center;font-weight:bold}.actions{max-width:1100px;margin:18px auto;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button{cursor:pointer;font:inherit;font-weight:700;border:2px solid #c69b4d;border-radius:7px;background:#29242a;color:#f4d8a0;padding:10px 18px;min-height:44px}button.primary{background:#8e251c;color:#ffe6a6}button:disabled{opacity:.4;cursor:not-allowed}button[aria-pressed=true]{outline:3px solid #d7a73f}input{font:inherit;width:100%;padding:10px;background:#27242b;color:#fff;border:2px solid #b9914c;border-radius:5px}.preview{height:130px;display:grid;place-items:center}.preview .sprite{font-size:64px}.choices{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0}.desc{line-height:1.9}.note{text-align:center;font-size:12px;color:#293e45;background:#ffffffaa;border-radius:6px;padding:5px;max-width:1080px;margin:12px auto}.hidden{display:none!important}@media(max-width:650px){.layout{grid-template-columns:1fr}.slots{gap:7px}.slot{min-height:190px;padding:7px}.sprite{font-size:42px}.panel{padding:9px}.actions{justify-content:center}header{margin-top:6px}}
</style></head><body><main class="scene"><header id="heading">選擇你的江湖身分</header><div class="note">A4-59-C 角色欄位測試｜使用獨立測試資料；不讀寫 A4-58 正式存檔</div>
<section id="selection"><div class="slots" id="slots"></div><div class="actions"><button class="primary" id="enter" disabled>進入江湖</button><button id="details" disabled>角色詳情</button><button id="remove" disabled>刪除角色</button><button id="backHome">返回首頁</button></div></section>
<section id="creation" class="hidden"><div class="layout"><div class="panel"><h2>角色預覽</h2><div class="preview"><div class="sprite" id="avatar">⚔️</div></div><div class="choices"><button data-sex="男" aria-pressed="true">男性</button><button data-sex="女" aria-pressed="false">女性</button></div><h2>職業選擇</h2><div class="choices"><button data-job="劍俠" aria-pressed="true">⚔ 劍俠</button><button data-job="遊俠" aria-pressed="false">🏹 遊俠</button><button data-job="武者" aria-pressed="false">🔱 武者</button></div></div><div><div class="panel"><h2 id="jobTitle">劍俠</h2><p class="desc" id="jobDesc"></p><h2>職業資訊</h2><p class="desc" id="jobInfo"></p></div><div class="panel" style="min-height:unset;margin-top:12px"><h2>角色姓名</h2><input id="charName" maxlength="8" placeholder="請輸入角色姓名（1～8字）"><p id="validation" role="status"></p></div></div></div><div class="actions"><button id="cancel">返回</button><button class="primary" id="create">建立角色</button></div></section>
</main><script src="character-slots.js"></script><script>
'use strict';const $=id=>document.getElementById(id);const jobs={'劍俠':['劍','育德劍法','以劍術與劍氣為主要戰鬥方式。'],'遊俠':['弓','弓術','擅長遠距離攻擊與靈活走位。'],'武者':['長槍','槍道','以長槍進行近身範圍攻擊。']};const store=JianghuCharacterSlots.createStore(localStorage);let slots=[null,null,null],selected=0,sex='男',job='劍俠',mode='selection';try{const data=store.read();slots=data.slots;selected=data.lastSelected}catch(e){alert(e.message+'；此頁面將停用建立及刪除功能');document.getElementById('create').disabled=true;document.getElementById('remove').disabled=true;}const icon={'劍俠':'⚔️','遊俠':'🏹','武者':'🔱'};function render(){const creation=mode==='creation';$('selection').classList.toggle('hidden',creation);$('creation').classList.toggle('hidden',!creation);$('heading').textContent=creation?'創建新角色':'選擇你的江湖身分';$('slots').replaceChildren(...slots.map((c,i)=>{const b=document.createElement('button');b.className='panel slot';b.setAttribute('aria-pressed',String(selected===i));b.innerHTML='<div class="sprite">'+(c?icon[c.job]:'＋')+'</div><div class="plate"></div><div class="muted"></div>';b.querySelector('.plate').textContent=c?c.name:'空白欄位';b.querySelector('.muted').textContent=c?c.job+' · '+c.sex+' · Lv.1':'建立新角色';b.onclick=()=>{selected=i;if(!slots[i]){mode='creation';render()}else{try{store.select(i)}catch(e){alert(e.message)}render()}};return b}));const c=slots[selected];$('enter').disabled=!c;$('details').disabled=!c;$('remove').disabled=!c;$('avatar').textContent=icon[job];$('jobTitle').textContent=job;$('jobDesc').textContent=jobs[job][2];$('jobInfo').textContent='初始武器：'+jobs[job][0]+'　｜　初始武學：'+jobs[job][1];document.querySelectorAll('[data-sex]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.sex===sex)));document.querySelectorAll('[data-job]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.job===job)))}document.querySelectorAll('[data-sex]').forEach(b=>b.onclick=()=>{sex=b.dataset.sex;render()});document.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>{job=b.dataset.job;render()});$('cancel').onclick=()=>{mode='selection';render()};$('create').onclick=()=>{const name=$('charName').value.trim();if(!name||[...name].length>8){$('validation').textContent='請輸入 1～8 字的角色姓名';return}if(slots.some(c=>c?.name===name)){$('validation').textContent='角色姓名不能重複';return}try{store.create(selected,{name,sex,job});slots=store.read().slots}catch(e){$('validation').textContent=e.message;return}$('charName').value='';$('validation').textContent='';mode='selection';render()};$('remove').onclick=()=>{const c=slots[selected];if(c&&prompt('輸入角色姓名以確認刪除（僅此預覽）')===c.name){try{store.remove(selected,c.name);slots=store.read().slots;render()}catch(e){alert(e.message)}}};$('details').onclick=()=>{const c=slots[selected];if(c)alert(c.name+'｜'+c.sex+'｜'+c.job+'｜Lv.1（介面預覽）')};$('enter').onclick=()=>alert('角色欄位已建立於獨立測試資料；正式遊戲載入及角色進度存檔尚未接線。');$('backHome').onclick=()=>alert('此為獨立介面預覽，正式首頁尚未接入。');render();
</script></body></html>

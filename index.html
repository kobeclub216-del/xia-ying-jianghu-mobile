<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>俠影江湖：群俠亂鬥 v0.01</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;background:#9ab878;touch-action:none}
#rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}
@media(orientation:portrait){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<div id="rotate">請將 iPhone 轉成橫向遊玩</div>
<script>
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=1280,H=720; c.width=W;c.height=H;
function fit(){let s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'} addEventListener('resize',fit);fit();

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let score=0, win=false, loot=null, skillCD=0, invuln=0, combo=0, comboT=0;

const p={x:310,y:390,r:30,hp:100,max:100,face:1,speed:260,attT:0,dodgeT:0};
let enemies=[
 {x:760,y:310,hp:45,max:45,cd:0,down:0},
 {x:900,y:430,hp:45,max:45,cd:.5,down:0},
 {x:1040,y:350,hp:45,max:45,cd:1,down:0}
];

let joy={id:null,cx:170,cy:560,x:170,y:560,dx:0,dy:0};
let buttons=[
 {name:'攻擊',x:1100,y:570,r:66,type:'atk'},
 {name:'閃避',x:950,y:610,r:48,type:'dodge'},
 {name:'育德\n劍法',x:1030,y:450,r:54,type:'skill'}
];
let keys={};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);

function pos(t){let r=c.getBoundingClientRect();return {x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}
function hitBtn(q,b){return Math.hypot(q.x-b.x,q.y-b.y)<b.r+12}
c.addEventListener('touchstart',e=>{
 e.preventDefault();
 for(const t of e.changedTouches){let q=pos(t);
  if(q.x<430 && q.y>360 && joy.id===null){joy.id=t.identifier;joy.x=q.x;joy.y=q.y;updateJoy();}
  else for(const b of buttons)if(hitBtn(q,b)){ if(b.type==='atk')attack(); if(b.type==='dodge')dodge(); if(b.type==='skill')skill(); }
 }
},{passive:false});
c.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){let q=pos(t);joy.x=q.x;joy.y=q.y;updateJoy()}},{passive:false});
c.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){joy.id=null;joy.x=joy.cx;joy.y=joy.cy;joy.dx=joy.dy=0}},{passive:false});
function updateJoy(){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy),m=85;if(d>m){dx*=m/d;dy*=m/d;joy.x=joy.cx+dx;joy.y=joy.cy+dy} joy.dx=dx/m;joy.dy=dy/m}

function attack(){
 if(p.attT>0||p.dodgeT>0||win)return;
 combo = comboT>0 ? Math.min(3,combo+1):1; comboT=.55; p.attT=.22;
 let range=combo===3?115:92, dmg=combo===3?18:12;
 enemies.forEach(e=>{if(e.hp>0 && Math.abs(e.y-p.y)<70 && ((e.x-p.x)*p.face)>-15 && Math.abs(e.x-p.x)<range){e.hp-=dmg;e.x+=p.face*(combo===3?80:35);if(combo===3)e.down=.55;if(e.hp<=0){score+=10;drop(e)}}});
}
function skill(){
 if(skillCD>0||p.dodgeT>0||win)return; skillCD=2.8;p.attT=.42;
 enemies.forEach(e=>{if(e.hp>0 && dist(p,e)<190){e.hp-=28;e.x+=(e.x>=p.x?1:-1)*115;e.down=.75;if(e.hp<=0){score+=10;drop(e)}}});
}
function dodge(){if(p.dodgeT<=0&&!win){p.dodgeT=.32;invuln=.38;p.x+=p.face*85}}
function drop(e){ if(!loot && Math.random()<.7)loot={x:e.x,y:e.y,name:'粗製鐵劍',picked:false}; }

let last=performance.now();
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function update(dt){
 if(win)return;
 p.attT=Math.max(0,p.attT-dt);p.dodgeT=Math.max(0,p.dodgeT-dt);invuln=Math.max(0,invuln-dt);skillCD=Math.max(0,skillCD-dt);
 comboT=Math.max(0,comboT-dt);if(comboT===0)combo=0;
 let dx=joy.dx+(keys['d']?1:0)-(keys['a']?1:0),dy=joy.dy+(keys['s']?1:0)-(keys['w']?1:0);
 let m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m} if(Math.abs(dx)>.08)p.face=Math.sign(dx);
 if(p.attT<=0){p.x=clamp(p.x+dx*p.speed*dt,70,1210);p.y=clamp(p.y+dy*p.speed*.72*dt,185,555)}
 enemies.forEach(e=>{
  if(e.hp<=0)return;e.cd=Math.max(0,e.cd-dt);e.down=Math.max(0,e.down-dt);if(e.down>0)return;
  let d=dist(p,e);
  if(d>70){let vx=(p.x-e.x)/d,vy=(p.y-e.y)/d;e.x+=vx*105*dt;e.y+=vy*82*dt}
  else if(e.cd<=0){e.cd=1.15;if(invuln<=0){p.hp-=9;invuln=.45;p.x+=(p.x>=e.x?1:-1)*28}}
 });
 if(loot&&!loot.picked&&dist(p,loot)<55){loot.picked=true;score+=25}
 if(p.hp<=0){p.hp=100;p.x=310;p.y=390;score=Math.max(0,score-10)}
 if(enemies.every(e=>e.hp<=0))win=true;
}
function bar(x,y,w,h,val,max,color){ctx.fillStyle='#222';ctx.fillRect(x,y,w,h);ctx.fillStyle=color;ctx.fillRect(x+2,y+2,(w-4)*clamp(val/max,0,1),h-4)}
function circle(x,y,r,fill,stroke='#ffffff55'){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
function draw(){
 ctx.clearRect(0,0,W,H);
 let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87a9bd');g.addColorStop(.42,'#b8c994');g.addColorStop(1,'#718d55');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='#526e45';ctx.beginPath();ctx.moveTo(0,260);ctx.lineTo(170,150);ctx.lineTo(330,250);ctx.lineTo(520,130);ctx.lineTo(760,260);ctx.lineTo(940,140);ctx.lineTo(1280,260);ctx.lineTo(1280,390);ctx.lineTo(0,390);ctx.fill();
 ctx.fillStyle='#9e8a61';ctx.fillRect(0,540,1280,35);
 ctx.fillStyle='#0008';ctx.fillRect(20,20,360,90);ctx.fillStyle='white';ctx.font='bold 28px sans-serif';ctx.fillText('李行天  Lv.1',38,54);bar(38,68,300,22,p.hp,p.max,'#d94d45');
 ctx.font='22px sans-serif';ctx.fillText('戰利值 '+score,400,52);ctx.fillText('敵人 '+enemies.filter(e=>e.hp>0).length+'/3',400,82);

 // player shadow/body
 ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,p.y+33,36,13,0,0,7);ctx.fill();ctx.globalAlpha=1;
 ctx.fillStyle=p.dodgeT>0?'#e8f3ff':'#e6d6b7';ctx.beginPath();ctx.arc(p.x,p.y-20,18,0,7);ctx.fill();
 ctx.fillStyle='#355f82';ctx.fillRect(p.x-20,p.y-3,40,48);
 ctx.strokeStyle='#ddd';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x+10*p.face,p.y+10);ctx.lineTo(p.x+48*p.face,p.y-5);ctx.stroke();
 ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('李行天',p.x,p.y-48);

 enemies.forEach(e=>{if(e.hp<=0)return;ctx.globalAlpha=e.down>0?.55:1;ctx.fillStyle='#532f2f';ctx.fillRect(e.x-20,e.y-5,40,48);ctx.fillStyle='#c9a889';ctx.beginPath();ctx.arc(e.x,e.y-22,17,0,7);ctx.fill();ctx.globalAlpha=1;bar(e.x-34,e.y-57,68,9,e.hp,e.max,'#d94d45')});
 if(loot&&!loot.picked){ctx.fillStyle='#ffd95a';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('✦ 粗製鐵劍',loot.x,loot.y-20)}

 // joystick
 circle(joy.cx,joy.cy,90,'#17202a66');circle(joy.x,joy.y,38,'#ffffff99');
 buttons.forEach(b=>{let cd=b.type==='skill'&&skillCD>0;circle(b.x,b.y,b.r,cd?'#444a':'#24384dcc');ctx.fillStyle='white';ctx.font=(b.type==='atk'?'bold 24px':'20px')+' sans-serif';ctx.textAlign='center';let lines=b.name.split('\n');lines.forEach((s,i)=>ctx.fillText(s,b.x,b.y+(i-(lines.length-1)/2)*22+7));});
 if(skillCD>0){ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.fillText(skillCD.toFixed(1),1030,515)}
 if(win){ctx.fillStyle='#000a';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 54px sans-serif';ctx.fillText('戰鬥勝利！',W/2,H/2-25);ctx.font='28px sans-serif';ctx.fillText('v0.01 核心戰鬥測試完成',W/2,H/2+30)}
}
</script>
</body></html>

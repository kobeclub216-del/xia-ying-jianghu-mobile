<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A4-59-E 遊戲存檔整合驗證</title><style>body{font:16px -apple-system,"PingFang TC",sans-serif;background:#dfe9eb;color:#242a2c;padding:20px}main{max-width:680px;margin:auto;background:#faf0dc;border:4px ridge #ba9354;border-radius:10px;padding:20px}button{font:inherit;padding:12px;background:#26262c;color:#f5d99b;border:2px solid #ba9354;border-radius:8px}li{padding:8px;margin:8px 0;background:#fffa}.pass{color:#196a42}.fail{color:#b32323}</style></head><body><main><h2>俠影江湖 A4-59-E</h2><p>正式遊戲存檔格式與三角色欄位整合測試</p><p>本頁使用模擬遊戲狀態與記憶體資料，不會讀寫 A4-58 正式存檔。</p><button id="run">執行測試</button><p id="summary" role="status"></p><ol id="results"></ol></main><script src="character-slots.js"></script><script src="character-progress.js"></script><script src="character-game-bridge.js"></script><script>
function memory(){const m=new Map();return{getItem:k=>m.has(k)?m.get(k):null,setItem:(k,v)=>m.set(k,String(v)),removeItem:k=>m.delete(k)}}
function sample(name,job,level){return {playerName:name,playerJob:job,player:{x:200,y:200,hp:40,max:50,face:1},mapId:1,stage:1,level,exp:20,statPoints:0,martialPoints:0,score:10,inventory:['粗製鐵劍'],enemies:[],stats:{strength:10,vitality:10,agility:10,inner:10},swordPath:{},bowPath:{},spearPath:{},lightPath:{},martialGrowth:{}}}
function run(){const tests=[];const check=(v,m)=>{if(!v)throw Error(m||'結果不符')};const throws=f=>{let yes=false;try{f()}catch{yes=true}check(yes,'應拒絕此操作')};function test(n,f){try{f();tests.push({n,ok:true})}catch(e){tests.push({n,ok:false,error:e.message})}}
const storage=memory(),slots=JianghuCharacterSlots.createStore(storage);slots.create(0,{name:'李行天',job:'劍俠',sex:'男'});slots.create(1,{name:'雲霜',job:'遊俠',sex:'女'});slots.create(2,{name:'岳山',job:'武者',sex:'男'});let current=sample('李行天','劍俠',1);const game={snapshot:()=>JSON.parse(JSON.stringify(current)),restore:p=>{current=JSON.parse(JSON.stringify(p))},savedStage:p=>p.stage===1?1:null};const progress=JianghuCharacterProgress.createProgressStore(storage,p=>JianghuA459Bridge.validateProgress(p,game));const bridge=JianghuA459Bridge.createBridge({game,slots,progress});
test('A4-58 遊戲狀態格式驗證',()=>check(bridge.validateProgress(current)));
test('儲存角色一進度',()=>check(bridge.save(0)));
test('角色二尚無進度時不會載入角色一',()=>check(bridge.load(1)===null));
test('三角色可各自保存不同進度',()=>{current=sample('雲霜','遊俠',3);bridge.save(1);current=sample('岳山','武者',5);bridge.save(2);check(bridge.load(0).progress.level===1&&bridge.load(1).progress.level===3&&bridge.load(2).progress.level===5)});
test('切換角色能恢復原本進度',()=>{check(bridge.restore(0));check(current.playerName==='李行天'&&current.level===1);check(bridge.restore(2));check(current.playerName==='岳山'&&current.level===5)});
test('角色身分不符合時禁止覆蓋存檔',()=>throws(()=>bridge.save(0)));
test('損毀進度不允許載入',()=>{const id=slots.read().slots[1].id;storage.setItem(progress.key(id),'{broken');throws(()=>bridge.load(1))});
test('進度格式錯誤時拒絕儲存',()=>{current=sample('岳山','武者',5);current.player.hp=NaN;throws(()=>bridge.save(2))});
test('原 A4-58 單一存檔未被修改',()=>{storage.setItem(JianghuCharacterProgress.LEGACY,'legacy');current=sample('岳山','武者',6);bridge.save(2);check(storage.getItem(JianghuCharacterProgress.LEGACY)==='legacy')});
const ok=tests.filter(t=>t.ok).length;document.getElementById('summary').textContent=ok+' / '+tests.length+' 項通過';document.getElementById('results').replaceChildren(...tests.map(t=>{const li=document.createElement('li');li.className=t.ok?'pass':'fail';li.textContent=(t.ok?'通過：':'失敗：')+t.n+(t.error?'（'+t.error+'）':'');return li}));}
document.getElementById('run').onclick=run;run();
</script></body></html>

name: A4-59 M4 女性角色素材匯入
on:
  push:
    branches: [a4-59-character-system]
    paths: [A4-59-M4-female-portraits.zip]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: a4-59-character-system
      - name: Verify and extract exactly three female portraits
        shell: bash
        run: |
          set -euo pipefail
          test -f A4-59-M4-female-portraits.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          archive=Path("A4-59-M4-female-portraits.zip")
          names=["female-swordswoman.png","female-ranger.png","female-spearman.png"]
          expected={"assets/"+name for name in names}
          with zipfile.ZipFile(archive) as z:
              actual={i.filename for i in z.infolist() if not i.is_dir()}
              if actual != expected: raise SystemExit("素材 ZIP 檔案清單不符："+str(actual))
              for name in names:
                  info=z.getinfo("assets/"+name)
                  if info.file_size > 3_000_000: raise SystemExit("素材過大："+name)
                  data=z.read(info)
                  if not data.startswith(b"\\x89PNG\\r\\n\\x1a\\n"): raise SystemExit("非 PNG："+name)
                  dest=Path("assets")/name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  dest.write_bytes(data)
          PY
      - name: Commit female portrait PNG files to development branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/female-swordswoman.png assets/female-ranger.png assets/female-spearman.png
          if ! git diff --cached --quiet; then
            git commit -m "A4-59-M4: import approved female PNG portraits"
            git push origin HEAD:a4-59-character-system
          fi

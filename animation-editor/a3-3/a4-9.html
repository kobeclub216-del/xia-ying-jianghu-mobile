<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>俠影江湖 A4-9 跑步動畫</title><style>body{margin:0;background:#111827;color:#fff;font:16px -apple-system,"PingFang TC",sans-serif}main{max-width:640px;margin:auto;padding:16px}h2{font-size:22px}p{color:#cbd5e1;line-height:1.5}canvas{width:100%;height:430px;background:#28364b;border-radius:15px;touch-action:none}button{padding:12px;margin:4px;border:0;border-radius:9px;background:#dce8f8;color:#152438;font-size:16px}button.on,.primary{background:#71d3c4}textarea{width:100%;height:100px;box-sizing:border-box;background:#18263a;color:#fff}label{display:block;margin:12px 0}input{width:100%}#msg{min-height:2em}</style><main><h2>俠影江湖 A4-9｜國漫風細節精修</h2><p>沿用 A3-10 的手腳關節、軀幹前傾及腳掌鎖定；精修臉部、束髮、衣褶、袖口與靴子，不改骨架。可切換骨架對照。</p><canvas id="stage"></canvas><div id="keys"></div><label><input id="artEnabled" type="checkbox" checked style="width:auto"/> 顯示 A4-9 國漫風分層角色（取消勾選看原始骨架）</label><button id="preset" class="primary">載入我的 A3-3 動作</button><button id="play">▶ 播放／暫停</button><button id="reset">重設當前影格</button><label>播放速度 <span id="speedLabel">1.0</span> 倍<input id="speed" type="range" min=".2" max="2" step=".1" value="1"></label><label><input id="bobEnabled" type="checkbox" checked style="width:auto" /> 啟用跑步上下晃動</label><label>晃動幅度 <span id="bobLabel">8</span> 像素<input id="bobAmount" type="range" min="0" max="16" step="1" value="8"></label><label><input id="groundEnabled" type="checkbox" checked style="width:auto" /> 顯示地面與腳掌落地提示</label><label><input id="lockEnabled" type="checkbox" checked style="width:auto" /> 啟用智慧腳掌落地鎖定</label><label><input id="armEnabled" type="checkbox" checked style="width:auto" /> 啟用輕度手臂優化（取消勾選可比較）</label><button id="torsoPreset" class="primary">套用輕微前傾（四影格）</button><button id="torsoNeutral">恢復直立軀幹（四影格）</button><button id="torsoReset">重設當前影格軀幹</button><button id="save">儲存到此瀏覽器</button><button id="export">匯出 JSON</button><button id="import">匯入 JSON</button><textarea id="data" placeholder="匯出 JSON 後可複製備份；亦可貼入 JSON 再匯入"></textarea><p id="msg">A4-9 保留 A3-10 關節資料，僅細修分層造型；仍是程式繪製美術測試版，尚非精繪 Sprite。</p></main><script>
const c=document.querySelector('#stage'),ctx=c.getContext('2d'),colors=['#67b8ed','#67b8ed','#efa95c','#efa95c','#67b8ed','#67b8ed','#efa95c','#efa95c'],store='xiaying-a4-9-refined-v1';
const clone=x=>JSON.parse(JSON.stringify(x));
// 每影格依序：左肘、左腕、右肘、右腕、左膝、左踝、右膝、右踝。

const defaults=[[[-41.583477959042014,150.361005052258],[-55.03983956188053,200.0910370627482],[42.957576458791294,170.2530178564541],[92.68760846928149,153.2863010528751],[66.35994446372786,248.35842107292984],[112.57962127347751,299.25857148366686],[-33.372093023255815,275.7170542635659],[-94.71317829457365,310.36046511627904]],[[35.351806857186894,166.74266265571362],[83.91172046743024,154.45641945312195],[-58.257665162559306,151.23859385244313],[-61.47549076323809,199.50597786262477],[-30.51162790697674,274.4457364341085],[-91.53488372093022,306.54651162790697],[58.16279069767442,255.69379844961242],[103.93023255813954,304.6395348837209]],[[-59.72031316286785,154.74894905318362],[-43.046125959350555,205.35656986385894],[48.808168460025435,174.0559026572563],[86.5444868679856,164.6949554552817],[71.91800686490029,251.86877627367036],[109.65432527286043,305.6942226850244],[-39.828300358671775,269.1280226773111],[-88.09568436885341,312.71493308650537]],[[32.426510856569834,171.7156658567626],[86.25195726792387,160.89207065447945],[-55.039839561880555,160.8920706544795],[-38.658181958424954,197.1657410621312],[-31.782945736434115,276.98837209302326],[-83.27131782945737,305.9108527131782],[76.01342126576417,252.45383547379376],[118.13768367464996,300.42868988391365]]];
const neutralTorso=()=>Array.from({length:4},()=>[[0,108],[0,226]]);
const leanTorso=()=>[[[9,110],[0,226]],[[11,112],[1,227]],[[9,110],[0,226]],[[11,112],[1,227]]];
let frames=clone(defaults),torsos=leanTorso(),selected=0,playing=true,phase=0,last=0,drag=-1;

function setup(){const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=Math.round(r.width*d);c.height=Math.round(r.height*d);ctx.setTransform(d,0,0,d,0,0)}

function render(){setup();let w=c.clientWidth,h=c.clientHeight,scale=Math.min(w/320,h/410),ox=w/2,oy=36;ctx.save();ctx.translate(ox,oy);ctx.scale(scale,scale);
let i=Math.floor(phase)%4,t=phase-Math.floor(phase),p=playing?interpolate(frames[i],frames[(i+1)%4],t*t*(3-2*t)):frames[selected];
p=clone(p);
const torso=playing?interpolate(torsos[i],torsos[(i+1)%4],t*t*(3-2*t)):torsos[selected];
const sh=[...torso[0]],hip=[...torso[1]];

const sd=[sh[0],sh[1]-108],hd=[hip[0],hip[1]-226];
for(const j of [0,1,2,3]){p[j][0]+=sd[0];p[j][1]+=sd[1]}
for(const j of [4,5,6,7]){p[j][0]+=hd[0];p[j][1]+=hd[1]}
// 接地修正只套用於渲染姿勢，不寫入使用者原始影格。
// 只在播放時移動整體骨架，絕不改寫任何關節座標。
const bobOn=document.querySelector('#bobEnabled').checked;
const bobAmp=Number(document.querySelector('#bobAmount').value);
const bob=bobOn&&playing ? -bobAmp*(1-Math.cos(phase*Math.PI*2))/2 : 0;

// 兩腳交替短暫支撐：右腳在影格2附近，左腳在影格4附近。
// 著地中心維持原始腳踝的水平位置；接地時鎖定世界座標的高度。
// 過渡區以 smoothstep 漸入漸出，避免腳掌突然吸附或彈開。
let lockFoot=-1,lockWeight=0;
if(playing&&document.querySelector('#lockEnabled').checked){
  const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
  const contact=(center)=>{let d=Math.abs(((phase-center+2+4)%4)-2);
    return d<=.18?1:d>=.42?0:1-smooth((d-.18)/.24)};
  // 以最新 A3-6 使用者影格 2 / 4 的落地姿勢為基準。
  const right=contact(1),left=contact(3);
  lockFoot=right>=left?7:5;lockWeight=Math.max(right,left);
  if(lockWeight>0){
    const center=lockFoot===7?1:3;
    const anchor=frames[center][lockFoot];
    const dx=(anchor[0]-p[lockFoot][0])*lockWeight;
    // 固定世界高度：接地中心當下的 bob 也是 0，維持原始落地腳踝高度。
    const dy=(anchor[1]-p[lockFoot][1]-bob)*lockWeight;
    p[lockFoot][0]+=dx;p[lockFoot][1]+=dy;
    const knee=lockFoot-1;
    // 膝蓋只吸收部分修正，避免整條腿被腳踝硬拉。
    p[knee][0]+=dx*.26;p[knee][1]+=dy*.3;
  }
}
ctx.translate(0,bob);
const armOn=document.querySelector('#armEnabled').checked;
const shoulderShift=armOn&&playing?Math.sin(phase*Math.PI/2)*2:0;
if(armOn){
 for(const j of [0,2]){
  const sx=(j===0?8:-8)+sd[0];
  const dx=(sx-p[j][0])*.06,dy=(sh[1]+4-p[j][1])*.04;
  p[j][0]+=dx;p[j][1]+=dy;
  p[j+1][0]+=dx*.5;p[j+1][1]+=dy*.5;
 }
}
if(document.querySelector('#groundEnabled').checked){
  ctx.save();ctx.translate(0,-bob);
  ctx.strokeStyle='#6e8ca1';ctx.lineWidth=2;ctx.setLineDash([7,8]);
  ctx.beginPath();ctx.moveTo(-140,322);ctx.lineTo(140,322);ctx.stroke();ctx.setLineDash([]);
  ctx.restore();
  for(const idx of [5,7]){
    const foot=p[idx],gap=322-(foot[1]+bob);
    if(gap>=0&&gap<42){
      ctx.fillStyle=idx===5?'rgba(103,184,237,.25)':'rgba(239,169,92,.25)';
      ctx.beginPath();ctx.ellipse(foot[0],322-bob,Math.max(5,17-gap*.25),3,0,0,Math.PI*2);ctx.fill();
    }
  }
}
const art=document.querySelector('#artEnabled').checked;
const limb=(a,b,c,d,width,color,trim)=>{line(a,b,trim,width+4);line(b,c,trim,width-1);line(a,b,color,width);line(b,c,color,width-5)};
if(art){
 const poly=(points,fill,stroke='#263244',lw=2)=>{ctx.beginPath();ctx.moveTo(...points[0]);for(const q of points.slice(1))ctx.lineTo(...q);ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}};
 const capsule=(a,b,w,fill,outline='#263244')=>{line(a,b,outline,w+4);line(a,b,fill,w)};
 const hand=(p0)=>{ctx.fillStyle='#e7c7a5';ctx.strokeStyle='#8c7468';ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(p0[0]+2,p0[1],7,9,-.2,0,Math.PI*2);ctx.fill();ctx.stroke()};
 const shoe=(ankle,knee,front)=>{const dir=ankle[0]>=knee[0]?1:-1;poly([[ankle[0]-7,ankle[1]-6],[ankle[0]+7,ankle[1]-6],[ankle[0]+dir*17,ankle[1]+4],[ankle[0]-dir*5,ankle[1]+6]],front?'#303746':'#222b39','#111a29',2);line([ankle[0]-8,ankle[1]+5],[ankle[0]+dir*16,ankle[1]+5],'#a1a8ad',2)};
 // 背面腿、靴子：由同一組 A3-10 髖／膝／踝座標驅動
 for(const side of [4,6]){const root=[hip[0]+(side===4?9:-9),hip[1]],knee=p[side],ankle=p[side+1],near=side===6;
 capsule(root,knee,near?19:17,near?'#404b61':'#303b4f');
 capsule(knee,ankle,near?15:14,near?'#3d4657':'#2b3445');
 line([knee[0]-4,knee[1]+4],[ankle[0]-4,ankle[1]-9],'#69778a',2);
 shoe(ankle,knee,near);
 // 靴面布條沿腳踝附著
 line([ankle[0]-5,ankle[1]-8],[ankle[0]+5,ankle[1]-3],'#a3aeb9',2);
 line([ankle[0]-6,ankle[1]-13],[ankle[0]+4,ankle[1]-9],'#8d9bb0',2);
 }
 // 後擺衣襬依髖部位移，衣袍布片與褶線
 const flutter=playing?Math.sin(phase*Math.PI/2)*7:0;
 poly([[hip[0]-11,hip[1]-30],[hip[0]+7,hip[1]-27],[hip[0]+9,hip[1]+13],[hip[0]-36-flutter,hip[1]+39],[hip[0]-28,hip[1]+3]],'#566e8e','#27354a',2);
 poly([[hip[0]-9,hip[1]-20],[hip[0]+14,hip[1]-22],[hip[0]+23,hip[1]+26],[hip[0]-8,hip[1]+43]],'#7188a6','#28374d',2);
 line([hip[0]-9,hip[1]+3],[hip[0]-22,hip[1]+29],'#c0c9cf',2);
 line([hip[0]+8,hip[1]+3],[hip[0]+14,hip[1]+23],'#d3d7d5',2);
 line([hip[0]-20,hip[1]+8],[hip[0]-30-flutter*.4,hip[1]+27],'#8ea1b6',2);
 // 軀幹：深色衣緣、米白內襯、灰藍長袍
 capsule(sh,hip,35,'#29384e','#1b293a');
 capsule([sh[0]-4,sh[1]+4],[hip[0]-2,hip[1]-12],29,'#7287a6');
 poly([[sh[0]+3,sh[1]-12],[sh[0]+16,sh[1]+7],[hip[0]+13,hip[1]-17],[hip[0]+2,hip[1]-13]],'#e9dfcc','#35445a',1);
 poly([[sh[0]-9,sh[1]-4],[sh[0]+4,sh[1]+13],[hip[0]+6,hip[1]-13],[hip[0]-14,hip[1]-19]],'#617999','#344b67',1);
 capsule([hip[0]-15,hip[1]-18],[hip[0]+15,hip[1]-18],8,'#2c5277','#1d3049');
 ctx.fillStyle='#d2b582';ctx.fillRect(hip[0]-3,hip[1]-23,6,10);
 // 交領與腰帶末端
 line([sh[0]-3,sh[1]-10],[hip[0]+8,hip[1]-26],'#f2e9d9',3);
 poly([[hip[0]-7,hip[1]-17],[hip[0]+1,hip[1]-16],[hip[0]-5,hip[1]+9],[hip[0]-12,hip[1]+13]],'#345d82','#1e3c5d',1);
 // 手臂：前後臂各一片布袖，與骨架關節完全一致
 for(const side of [0,2]){const root=[sh[0]+(side===0?8:-8)+(side===0?shoulderShift:-shoulderShift),sh[1]+4],elbow=p[side],wrist=p[side+1],near=side===2;
 capsule(root,elbow,near?18:16,near?'#8fa1b8':'#627a9a');
 capsule(elbow,wrist,near?15:13,near?'#d7d4ca':'#b9c5cf');
 // 袖口護腕
 capsule([wrist[0]+(elbow[0]-wrist[0])*.3,wrist[1]+(elbow[1]-wrist[1])*.3],wrist,13,'#3c516c');
 // 袖口雙層滾邊，保留手腕關節移動
 const cuff=[wrist[0]+(elbow[0]-wrist[0])*.21,wrist[1]+(elbow[1]-wrist[1])*.21];
 capsule(cuff,wrist,12,'#4e6b8c');
 line([cuff[0]-4,cuff[1]-3],[cuff[0]+4,cuff[1]+3],'#d4d8d3',2);
 hand(wrist);
 }
 // 頭髮、馬尾、臉與衣領隨肩膀前傾，始終右向
 const hx=sh[0]+8,hy=sh[1]-39;
 const swing=playing?Math.sin(phase*Math.PI/2)*5:0;
 ctx.strokeStyle='#202633';ctx.lineCap='round';ctx.lineWidth=16;ctx.beginPath();ctx.moveTo(hx-18,hy-18);ctx.quadraticCurveTo(hx-49,hy-36+swing,hx-62,hy-6+swing);ctx.stroke();
 ctx.strokeStyle='#647ea8';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(hx-21,hy-25);ctx.lineTo(hx-28,hy-14);ctx.stroke();
 // 低調髮絲與束髮尾端
 ctx.strokeStyle='#56677f';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx-25,hy-21);ctx.quadraticCurveTo(hx-44,hy-27+swing,hx-56,hy-11+swing);ctx.stroke();
 ctx.fillStyle='#e7c5a2';ctx.strokeStyle='#8e776b';ctx.lineWidth=1.5;ctx.beginPath();ctx.ellipse(hx+2,hy,20,23,0,0,Math.PI*2);ctx.fill();ctx.stroke();
 ctx.fillStyle='#242a38';ctx.beginPath();ctx.ellipse(hx-3,hy-18,24,15,-.15,Math.PI,Math.PI*2);ctx.fill();
 poly([[hx+7,hy-15],[hx+17,hy-12],[hx+20,hy-4],[hx+8,hy-8]],'#242a38',null);
 ctx.strokeStyle='#7d655c';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(hx+7,hy-11);ctx.lineTo(hx+17,hy-10);ctx.stroke();
 ctx.fillStyle='#1e2633';ctx.beginPath();ctx.ellipse(hx+12,hy-4,2.4,3.4,0,0,Math.PI*2);ctx.fill();
 ctx.strokeStyle='#b18f7b';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(hx+20,hy+1);ctx.lineTo(hx+23,hy+7);ctx.stroke();
 line([hx+15,hy+11],[hx+21,hy+10],'#986f62',1.5);
 poly([[sh[0]-12,sh[1]-11],[sh[0]+4,sh[1]+9],[sh[0]+11,sh[1]-3],[sh[0]+2,sh[1]-13]],'#e9e0d2','#41536b',1);
}else{
 line(sh,hip,'#dce6f5',27);
 for(let side of [2,0]){let shoulder=[sh[0]+(side===0?8:-8)+(side===0?shoulderShift:-shoulderShift),sh[1]+4];line(shoulder,p[side],colors[side],15);line(p[side],p[side+1],colors[side],12)}
 for(let side of [6,4]){let root=[hip[0]+(side===4?9:-9),hip[1]];line(root,p[side],colors[side],19);line(p[side],p[side+1],colors[side],15)}
 ctx.fillStyle='#e7c5a2';ctx.beginPath();ctx.arc(sh[0],sh[1]-35,24,0,7);ctx.fill();ctx.fillStyle='#303847';ctx.fillRect(sh[0]-22,sh[1]-63,42,12);
}
if(!playing){for(const [j,q] of [sh,hip].entries()){ctx.fillStyle=j===0?'#bc93ff':'#7ce1a0';ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(q[0],q[1],13,0,Math.PI*2);ctx.fill();ctx.stroke()}}
if(!playing)p.forEach(([x,y],j)=>{ctx.fillStyle=colors[j];ctx.strokeStyle='white';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,10,0,7);ctx.fill();ctx.stroke()});
ctx.restore();[...keyBox.children].forEach((b,i)=>b.classList.toggle('on',i===selected&&!playing))}
function coords(e){let r=c.getBoundingClientRect(),s=Math.min(r.width/320,r.height/410);return [(e.clientX-r.left-r.width/2)/s,(e.clientY-r.top-36)/s]}
c.addEventListener('pointerdown',e=>{if(playing)return;const p=coords(e);let best=24;drag=-1;[...frames[selected],...torsos[selected]].forEach((q,i)=>{let d=Math.hypot(q[0]-p[0],q[1]-p[1]);if(d<best){best=d;drag=i}});if(drag>=0)c.setPointerCapture(e.pointerId)});

for(let evt of ['pointerup','pointercancel'])c.addEventListener(evt,()=>drag=-1);

document.querySelector('#save').onclick=()=>{try{localStorage.setItem(store,JSON.stringify({frames,torsos}));msg.textContent='A4-9 已儲存到目前瀏覽器'}catch(e){msg.textContent='儲存失敗，請使用 JSON 匯出備份'}};
document.querySelector('#export').onclick=()=>{document.querySelector('#data').value=JSON.stringify({version:'A4-9',frames,torsos});msg.textContent='已產生 JSON，可全選複製保存'};
document.querySelector('#import').onclick=()=>{try{let x=JSON.parse(document.querySelector('#data').value),f=x.frames;if(!Array.isArray(f)||f.length!==4||f.some(a=>!Array.isArray(a)||a.length!==8||a.some(p=>!Array.isArray(p)||p.length!==2||p.some(n=>!Number.isFinite(n)))))throw Error();frames=clone(f);if(x.torsos&&Array.isArray(x.torsos)&&x.torsos.length===4&&x.torsos.every(t=>Array.isArray(t)&&t.length===2&&t.every(p=>Array.isArray(p)&&p.length===2&&p.every(Number.isFinite))))torsos=clone(x.torsos);else torsos=Array.from({length:4},()=>[[0,108],[0,226]]);playing=false;selected=0;phase=0;msg.textContent='已匯入四影格動作';render()}catch(e){msg.textContent='JSON 格式不正確'}};
try{let f=JSON.parse(localStorage.getItem(store));if(f&&Array.isArray(f.frames)&&f.frames.length===4){frames=f.frames;if(Array.isArray(f.torsos)&&f.torsos.length===4)torsos=f.torsos}else if(Array.isArray(f)&&f.length===4&&f.every(a=>Array.isArray(a)&&a.length===8))frames=f}catch(e){}
function tick(ts){if(playing){if(last)phase=(phase+(ts-last)/1000*Number(speed.value)*2)%4;selected=Math.floor(phase);render()}last=ts;requestAnimationFrame(tick)}render();requestAnimationFrame(tick);
</script></html>

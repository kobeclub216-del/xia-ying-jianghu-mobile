<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<title>俠影江湖：群俠亂鬥 v0.03-A</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171b20;touch-action:none;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{display:block;background:#9ab878;touch-action:none}#rotate{display:none;position:fixed;inset:0;background:#111;color:#fff;z-index:9;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:20px}@media(orientation:portrait){#rotate{display:flex}}</style>
</head><body><div id="wrap"><canvas id="game"></canvas></div><div id="rotate">請將 iPhone 轉成橫向遊玩</div><script>
const c=document.getElementById('game'),ctx=c.getContext('2d'),W=1280,H=720;c.width=W;c.height=H;function fit(){let s=Math.min(innerWidth/W,innerHeight/H);c.style.width=W*s+'px';c.style.height=H*s+'px'}addEventListener('resize',fit);fit();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);let score=0,win=false,gameOver=false,loot=null,skillCD=0,invuln=0,combo=0,comboT=0,shake=0,flash=0,bossSpawned=false,bossDefeated=false,comboPop=0;let fx=[];
const p={x:310,y:390,r:30,hp:100,max:100,face:1,speed:260,attT:0,dodgeT:0};
function makeEnemies(){return[{x:760,y:310,hp:45,max:45,cd:0,down:0,hit:0,boss:false},{x:900,y:430,hp:45,max:45,cd:.5,down:0,hit:0,boss:false},{x:1040,y:350,hp:45,max:45,cd:1,down:0,hit:0,boss:false}]}
let enemies=makeEnemies();
let joy={id:null,cx:170,cy:560,x:170,y:560,dx:0,dy:0};let buttons=[{name:'攻擊',x:1100,y:570,r:66,type:'atk'},{name:'閃避',x:950,y:610,r:48,type:'dodge'},{name:'育德\n劍法',x:1030,y:450,r:54,type:'skill'}],keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
function pos(t){let r=c.getBoundingClientRect();return{x:(t.clientX-r.left)*W/r.width,y:(t.clientY-r.top)*H/r.height}}function hitBtn(q,b){return Math.hypot(q.x-b.x,q.y-b.y)<b.r+12}
function retry(){score=0;win=false;gameOver=false;loot=null;skillCD=0;invuln=0;combo=0;comboT=0;shake=0;flash=0;bossSpawned=false;bossDefeated=false;comboPop=0;fx=[];p.x=310;p.y=390;p.hp=100;p.face=1;p.attT=0;p.dodgeT=0;enemies=makeEnemies();joy.id=null;joy.x=joy.cx;joy.y=joy.cy;joy.dx=joy.dy=0}
c.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches){let q=pos(t);if(gameOver){if(q.x>=480&&q.x<=800&&q.y>=500&&q.y<=610)retry();continue}if(q.x<430&&q.y>360&&joy.id===null){joy.id=t.identifier;joy.x=q.x;joy.y=q.y;updateJoy()}else for(const b of buttons)if(hitBtn(q,b)){if(b.type==='atk')attack();if(b.type==='dodge')dodge();if(b.type==='skill')skill()}}},{passive:false});c.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){let q=pos(t);joy.x=q.x;joy.y=q.y;updateJoy()}},{passive:false});c.addEventListener('touchend',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){joy.id=null;joy.x=joy.cx;joy.y=joy.cy;joy.dx=joy.dy=0}},{passive:false});function updateJoy(){let dx=joy.x-joy.cx,dy=joy.y-joy.cy,d=Math.hypot(dx,dy),m=85;if(d>m){dx*=m/d;dy*=m/d;joy.x=joy.cx+dx;joy.y=joy.cy+dy}joy.dx=dx/m;joy.dy=dy/m}
function slash(x,y,big=false){fx.push({x,y,t:big?.34:.20,max:big?.34:.20,big})}function impact(x,y){fx.push({x,y,t:.22,max:.22,impact:true});shake=Math.max(shake,7);flash=.05;if(navigator.vibrate)navigator.vibrate(18)}
function damageEnemy(e,dmg,kb,down){e.hp-=dmg;e.hit=.11;e.down=Math.max(e.down,down);e.x+=kb;impact(e.x,e.y);if(e.hp<=0){score+=e.boss?100:10;fx.push({x:e.x,y:e.y,t:.6,max:.6,death:true});if(e.boss){bossDefeated=true;loot={x:e.x,y:e.y,name:'青鋼長劍',picked:false}}else drop(e)}}
function attack(){if(p.attT>0||p.dodgeT>0||win||gameOver)return;combo=comboT>0?Math.min(3,combo+1):1;comboT=.58;comboPop=.45;p.attT=.22;slash(p.x+55*p.face,p.y,combo===3);let range=combo===3?125:98,dmg=combo===3?18:12;enemies.forEach(e=>{if(e.hp>0&&Math.abs(e.y-p.y)<72&&((e.x-p.x)*p.face)>-15&&Math.abs(e.x-p.x)<range)damageEnemy(e,dmg,p.face*(combo===3?85:32),combo===3?.6:.13)})}
function skill(){if(skillCD>0||p.dodgeT>0||win||gameOver)return;skillCD=2.8;p.attT=.44;shake=10;fx.push({x:p.x,y:p.y,t:.5,max:.5,skill:true});enemies.forEach(e=>{if(e.hp>0&&dist(p,e)<205)damageEnemy(e,28,(e.x>=p.x?1:-1)*120,.78)})}function dodge(){if(p.dodgeT<=0&&!win&&!gameOver){p.dodgeT=.32;invuln=.38;p.x+=p.face*85}}function drop(e){if(!loot&&Math.random()<.7)loot={x:e.x,y:e.y,name:'粗製鐵劍',picked:false}}
function spawnBoss(){bossSpawned=true;enemies.push({x:1050,y:365,hp:150,max:150,cd:.5,down:0,hit:0,boss:true});fx.push({x:1050,y:365,t:1,max:1,spawn:true});shake=12}
let last=performance.now();function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
function update(dt){if(win||gameOver)return;p.attT=Math.max(0,p.attT-dt);p.dodgeT=Math.max(0,p.dodgeT-dt);invuln=Math.max(0,invuln-dt);skillCD=Math.max(0,skillCD-dt);comboT=Math.max(0,comboT-dt);comboPop=Math.max(0,comboPop-dt);shake=Math.max(0,shake-28*dt);flash=Math.max(0,flash-dt);if(comboT===0)combo=0;fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);let dx=joy.dx+(keys.d?1:0)-(keys.a?1:0),dy=joy.dy+(keys.s?1:0)-(keys.w?1:0),m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}if(Math.abs(dx)>.08)p.face=Math.sign(dx);if(p.attT<=0){p.x=clamp(p.x+dx*p.speed*dt,70,1210);p.y=clamp(p.y+dy*p.speed*.72*dt,185,555)}enemies.forEach(e=>{if(e.hp<=0)return;e.cd=Math.max(0,e.cd-dt);e.down=Math.max(0,e.down-dt);e.hit=Math.max(0,e.hit-dt);if(e.down>0||e.hit>0)return;let d=dist(p,e),spd=e.boss?82:105;if(d>(e.boss?82:70)){e.x+=(p.x-e.x)/d*spd*dt;e.y+=(p.y-e.y)/d*(e.boss?68:82)*dt}else if(e.cd<=0){e.cd=e.boss?1.35:1.15;if(invuln<=0){p.hp-=e.boss?16:9;invuln=.45;p.x+=(p.x>=e.x?1:-1)*(e.boss?48:28);shake=5}}});if(!bossSpawned&&enemies.slice(0,3).every(e=>e.hp<=0))spawnBoss();if(loot&&!loot.picked&&dist(p,loot)<55){loot.picked=true;score+=loot.name==='青鋼長劍'?75:25}if(p.hp<=0){p.hp=0;gameOver=true;joy.id=null;joy.x=joy.cx;joy.y=joy.cy;joy.dx=joy.dy=0}if(bossDefeated)win=true}
function bar(x,y,w,h,val,max,color){ctx.fillStyle='#222';ctx.fillRect(x,y,w,h);ctx.fillStyle=color;ctx.fillRect(x+2,y+2,(w-4)*clamp(val/max,0,1),h-4)}function circle(x,y,r,fill,stroke='#ffffff55'){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke()}
function draw(){ctx.clearRect(0,0,W,H);ctx.save();let sx=shake?(Math.random()-.5)*shake:0,sy=shake?(Math.random()-.5)*shake:0;ctx.translate(sx,sy);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#87a9bd');g.addColorStop(.42,'#b8c994');g.addColorStop(1,'#718d55');ctx.fillStyle=g;ctx.fillRect(-20,-20,W+40,H+40);ctx.fillStyle='#526e45';ctx.beginPath();ctx.moveTo(0,260);ctx.lineTo(170,150);ctx.lineTo(330,250);ctx.lineTo(520,130);ctx.lineTo(760,260);ctx.lineTo(940,140);ctx.lineTo(1280,260);ctx.lineTo(1280,390);ctx.lineTo(0,390);ctx.fill();ctx.fillStyle='#9e8a61';ctx.fillRect(0,540,1280,35);ctx.fillStyle='#0008';ctx.fillRect(20,20,360,90);ctx.fillStyle='white';ctx.font='bold 28px sans-serif';ctx.textAlign='left';ctx.fillText('李行天  Lv.1',38,54);bar(38,68,300,22,p.hp,p.max,'#d94d45');ctx.font='22px sans-serif';ctx.fillText('戰利值 '+score,400,52);ctx.fillText(bossSpawned&&!bossDefeated?'山賊頭目出現！':'敵人 '+enemies.filter(e=>e.hp>0&&!e.boss).length+'/3',400,82);ctx.globalAlpha=.25;ctx.fillStyle='#000';ctx.beginPath();ctx.ellipse(p.x,p.y+33,36,13,0,0,7);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=p.dodgeT>0?'#e8f3ff':'#e6d6b7';ctx.beginPath();ctx.arc(p.x,p.y-20,18,0,7);ctx.fill();ctx.fillStyle='#355f82';ctx.fillRect(p.x-20,p.y-3,40,48);ctx.strokeStyle='#ddd';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(p.x+10*p.face,p.y+10);ctx.lineTo(p.x+48*p.face,p.y-5);ctx.stroke();ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.textAlign='center';ctx.fillText('李行天',p.x,p.y-48);enemies.forEach(e=>{if(e.hp<=0)return;ctx.globalAlpha=e.down>0?.55:1;ctx.fillStyle=e.hit>0?'#fff':(e.boss?'#351c1c':'#532f2f');ctx.fillRect(e.x-(e.boss?28:20),e.y-5,e.boss?56:40,e.boss?62:48);ctx.fillStyle=e.hit>0?'#fff':'#c9a889';ctx.beginPath();ctx.arc(e.x,e.y-(e.boss?28:22),e.boss?22:17,0,7);ctx.fill();ctx.globalAlpha=1;bar(e.x-(e.boss?55:34),e.y-(e.boss?72:57),e.boss?110:68,e.boss?12:9,e.hp,e.max,e.boss?'#b51f2e':'#d94d45');if(e.boss){ctx.fillStyle='white';ctx.font='bold 18px sans-serif';ctx.fillText('山賊頭目',e.x,e.y-82)}});if(loot&&!loot.picked){ctx.fillStyle=loot.name==='青鋼長劍'?'#6de0ff':'#ffd95a';ctx.font='bold 22px sans-serif';ctx.textAlign='center';ctx.fillText('✦ '+loot.name,loot.x,loot.y-20)}fx.forEach(f=>{let a=f.t/f.max;ctx.save();ctx.globalAlpha=a;if(f.skill){ctx.strokeStyle='#8deaff';ctx.lineWidth=10;ctx.beginPath();ctx.arc(f.x,f.y,210*(1-a)+40,-.8,2.5);ctx.stroke();ctx.strokeStyle='#fff';ctx.lineWidth=4;ctx.beginPath();ctx.arc(f.x,f.y,150*(1-a)+35,2.2,5.4);ctx.stroke()}else if(f.spawn){ctx.fillStyle='#b51f2e';ctx.font='bold 42px sans-serif';ctx.fillText('強敵來襲',W/2,170)}else if(f.death){ctx.fillStyle='#fff';for(let i=0;i<6;i++)ctx.fillRect(f.x+Math.cos(i)*45*(1-a),f.y+Math.sin(i)*35*(1-a),6,6)}else{ctx.strokeStyle=f.big?'#fff4b0':'#fff';ctx.lineWidth=f.big?12:7;ctx.beginPath();ctx.arc(f.x,f.y,f.big?70:45,-1.1,1.1);ctx.stroke()}ctx.restore()});if(comboPop>0&&combo>1){ctx.fillStyle='#fff4b0';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(combo+' HIT',p.x,p.y-92)}circle(joy.cx,joy.cy,90,'#17202a66');circle(joy.x,joy.y,38,'#ffffff99');buttons.forEach(b=>{let cd=b.type==='skill'&&skillCD>0;circle(b.x,b.y,b.r,cd?'#444a':'#24384dcc');ctx.fillStyle='white';ctx.font=(b.type==='atk'?'bold 24px':'20px')+' sans-serif';ctx.textAlign='center';b.name.split('\n').forEach((s,i,a)=>ctx.fillText(s,b.x,b.y+(i-(a.length-1)/2)*22+7))});if(skillCD>0){ctx.fillStyle='white';ctx.font='18px sans-serif';ctx.fillText(skillCD.toFixed(1),1030,515)}ctx.restore();if(flash>0){ctx.fillStyle='#ffffff22';ctx.fillRect(0,0,W,H)}if(win){ctx.fillStyle='#000b';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 54px sans-serif';ctx.fillText('戰鬥勝利！',W/2,H/2-38);ctx.font='28px sans-serif';ctx.fillText('擊敗山賊頭目',W/2,H/2+12);ctx.fillStyle='#6de0ff';ctx.fillText('Boss 掉落：青鋼長劍',W/2,H/2+58)}if(gameOver){ctx.fillStyle='#000c';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='white';ctx.font='bold 58px sans-serif';ctx.fillText('戰鬥失敗',W/2,270);ctx.font='26px sans-serif';ctx.fillText('李行天力竭倒下',W/2,325);ctx.fillStyle='#29465f';ctx.fillRect(480,500,320,110);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(480,500,320,110);ctx.fillStyle='white';ctx.font='bold 32px sans-serif';ctx.fillText('重新挑戰',W/2,568)}}
</script></body></html>

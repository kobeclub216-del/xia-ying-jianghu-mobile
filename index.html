function impact(x,y){fx.push({x,y,t:.22,max:.22});shake=Math.max(shake,7);flash=.05}function damageEnemy(e,dmg,kb,down){e.hp-=dmg;e.hit=.11;e.down=Math.max(e.down,down);e.x+=kb;impact(e.x,e.y);fx.push({x:e.x,y:e.y-55,t:.7,max:.7,damage:true,value:dmg});if(e.hp<=0){score+=e.boss?100:10;gainExp(e.boss?40:12);fx.push({x:e.x,y:e.y,t:.6,max:.6,death:true});if(e.boss){bossDefeated=true;loot={x:e.x,y:e.y,name:'青鋼長劍',picked:false}}else if((!loot||loot.picked)&&Math.random()<.7)loot={x:e.x,y:e.y,name:'粗製鐵劍',picked:false}}}
function shootBow(){p.attT=.42;combo=0;comboT=0;let targets=enemies.filter(e=>e.hp>0),target=null,best=9999;targets.forEach(e=>{let dx=e.x-p.x;if(dx*p.face>-20){let d=dist(p,e);if(d<best&&d<650){best=d;target=e}}});let dx=p.face,dy=0;if(target){dx=target.x-p.x;dy=target.y-p.y;let d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;p.face=dx>=0?1:-1}projectiles.push({x:p.x+p.face*32,y:p.y-8,dx,dy,speed:720,life:1.05,dmg:9+atkBonus()+levelAtk()+agiAtk()});fx.push({x:p.x+35*p.face,y:p.y-8,t:.18,max:.18,bow:true})}

function spawnNextWave(){wave++;enemies=enemies.concat(makeWave(wave));fx.push({x:W/2,y:170,t:1,max:1,wave:true,name:'第 '+wave+' 波'});shake=7}function spawnBoss(){bossSpawned=true;enemies.push({x:1050,y:365,hp:150,max:150,cd:1.1,down:0,hit:0,boss:true,warn:0,chargeWarn:0,chargeT:0,chargeDX:0,chargeDY:0,chargeHit:false,nextMove:0});fx.push({x:1050,y:365,t:1,max:1,spawn:true});shake=12}

function update(dt){if(win||gameOver||bagOpen||statsOpen||martialOpen)return;p.attT=Math.max(0,p.attT-dt);p.dodgeT=Math.max(0,p.dodgeT-dt);invuln=Math.max(0,invuln-dt);skillCD=Math.max(0,skillCD-dt);comboT=Math.max(0,comboT-dt);comboPop=Math.max(0,comboPop-dt);shake=Math.max(0,shake-28*dt);flash=Math.max(0,flash-dt);if(comboT===0)combo=0;fx.forEach(f=>f.t-=dt);fx=fx.filter(f=>f.t>0);let dx=joy.dx,dy=joy.dy,m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}if(Math.abs(dx)>.08)p.face=Math.sign(dx);if(p.attT<=0){p.x=clamp(p.x+dx*p.speed*dt,70,1210);p.y=clamp(p.y+dy*p.speed*.72*dt,185,555)}if(rapidBurst){rapidBurst.t-=dt;while(rapidBurst&&rapidBurst.t<=0){if(p.dodgeT>0||weaponType()!=='弓'){rapidBurst=null;break}fireRapidArrow(rapidBurst);rapidBurst.left--;rapidBurst.t+=.14;if(rapidBurst.left===0)rapidBurst=null}}projectiles.forEach(a=>{a.x+=a.dx*a.speed*dt;a.y+=a.dy*a.speed*dt;a.life-=dt;if(a.life>0){for(const e of enemies){if(e.hp>0&&dist(a,e)<42){damageEnemy(e,a.dmg,a.dx*25,.08);a.life=0;break}}}});projectiles=projectiles.filter(a=>a.life>0&&a.x>-30&&a.x<W+30&&a.y>120&&a.y<620);enemies.forEach(e=>{if(e.hp<=0)return;e.cd=Math.max(0,e.cd-dt);e.down=Math.max(0,e.down-dt);e.hit=Math.max(0,e.hit-dt);if(e.boss&&e.chargeT>0){e.chargeT=Math.max(0,e.chargeT-dt);e.x=clamp(e.x+e.chargeDX*520*dt,55,1225);e.y=clamp(e.y+e.chargeDY*390*dt,180,560);if(!e.chargeHit&&dist(p,e)<75){e.chargeHit=true;if(invuln<=0){p.hp-=22;invuln=.55;p.x=clamp(p.x+e.chargeDX*75,70,1210);p.y=clamp(p.y+e.chargeDY*50,185,555);shake=10}else fx.push({x:p.x,y:p.y,t:.45,max:.45,dodged:true})}return}if(e.boss&&e.chargeWarn>0){let before=e.chargeWarn;e.chargeWarn=Math.max(0,e.chargeWarn-dt);if(before>0&&e.chargeWarn===0)beginCharge(e);return}if(e.warn>0){let before=e.warn;e.warn=Math.max(0,e.warn-dt);if(e.boss&&before>0&&e.warn===0)bossHeavy(e);return}if(e.down>0||e.hit>0)return;let d=dist(p,e),spd=e.boss?82:105;if(d>(e.boss?95:70)){e.x+=(p.x-e.x)/d*spd*dt;e.y+=(p.y-e.y)/d*(e.boss?68:82)*dt}else if(e.cd<=0){if(e.boss){if(e.
